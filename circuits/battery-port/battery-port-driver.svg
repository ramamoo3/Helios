<text x="10" y="9.35" fill="#42566a" font-size="1.3385826771653544" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">PROJECT HELIOS   /   BATTERY PORT</text>
<text x="10" y="16.35" fill="#16364f" font-size="2.8559055118110237" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Gate drive for one bench half-bridge</text>
<text x="10" y="22.35" fill="#42566a" font-size="1.445669291338583" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">12 V / 24 V prototype     |     One instance per leg     |     10 V local drive bias</text>
<text x="130" y="29.35" fill="#42566a" font-size="1.7669291338582678" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Gate resistors and gate-to-source discharge paths</text>
<text x="28" y="78.35" fill="#42566a" font-size="1.7669291338582678" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Local bias and bootstrap storage</text>
<text x="27" y="110.35" fill="#42566a" font-size="1.445669291338583" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Place C4 and C5 at VDD/VSS. Place C6 at HB/HS.</text>
<text x="130" y="94.35" fill="#42566a" font-size="1.445669291338583" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">PERMIT is active high and is pulled low locally.</text>
<text x="130" y="100.35" fill="#42566a" font-size="1.445669291338583" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">PWM_H and PWM_L require controller dead time.</text>
<text x="12" y="122.35" fill="#42566a" font-size="1.445669291338583" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">SW returns to the high-side MOSFET source. DRV_0 returns to the low-side source.</text>
<text x="12" y="129.35" fill="#42566a" font-size="1.445669291338583" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Supply PWM and permission locally to each isolated bridge domain. Verify bootstrap charge before the first high-side pulse.</text>
<path d="M102 86v-1l1-.5-1-.5v1" stroke="#25384b" stroke-width=".16" fill="none"/></svg>
