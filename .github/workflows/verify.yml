name: Verify battery port
on: [push, pull_request]
permissions:
  contents: read
jobs:
  circuits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Check circuit connections and simulations
        run: python3 circuits/battery-port/verify.py --ngspice ngspice
